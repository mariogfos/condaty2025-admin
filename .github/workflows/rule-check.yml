name: Rule Check

on:
  push:
    branches:
      - main
      - makroz
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  rule-check:
    name: Verify Agency Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          separator: "\n"

      - name: Show changed files
        run: |
          echo "Changed files:"
          echo "${{ steps.changed.outputs.all_changed_files }}"

      - name: Run Pre-commit Rule Check
        env:
          STAGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          echo "$STAGED_FILES" | xargs -I {} bash .agent/hooks/pre-commit-check-rules.sh .

      - name: Check for rule violations
        run: |
          if grep -q "VIOLATION" <<< "$STAGED_FILES"; then
            echo "🔴 Rule violations detected!"
            exit 1
          fi

  # team-activity job removed 2026-07-15 (Mario): "ya no se usará".
  # update-team-activity.sh referenced a script that no longer exists in
  # this repo (was deleted 2026-06-06). The agency no longer needs an
  # auto-generated TEAM_CHANGES.md — manual changelog is enough.
  #
  # update-memory job: ver .github/workflows/update-memory.yml → ELIMINADO
  # 2026-07-15. Regla de agencia "NO update-module-memory.sh" es binding
  # cross-project. La auto-PR para module-memory.json era útil cuando los
  # módulos eran menos estables; ahora el directorio .makromania/projects/
  # es canónico y no necesita auto-sync.
